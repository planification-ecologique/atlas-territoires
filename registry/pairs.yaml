# Paires de conflits et de synergies.
#
# Une paire croise deux indicateurs, chacun pris à son extrémité "haut" ou "bas"
# (seuils définis dans indicators.yaml). Les hexagones qui remplissent les deux
# conditions forment la zone de recouvrement, mesurée en hectares et en
# habitants concernés.
#
# Une paire est une donnée, pas du code : en ajouter une ne demande que ce
# fichier. Le champ `question` est la question que la paire pose à la SNAT.

pairs:
  # ---------- Sobriété foncière (ZAN) ----------
  - id: conso_x_agri
    type: conflit
    a: { indicator: conso_enaf, end: high }
    b: { indicator: agri_part, end: high }
    title: L'artificialisation consomme des terres cultivées
    question: >
      Où la consommation d'espaces se fait-elle au détriment des terres
      agricoles, et la trajectoire ZAN protège-t-elle d'abord ces terres ?

  - id: conso_x_natura
    type: conflit
    a: { indicator: conso_enaf, end: high }
    b: { indicator: natura2000, end: high }
    title: L'artificialisation progresse dans les sites Natura 2000
    question: >
      La consommation d'espaces touche-t-elle des sites protégés, et faut-il
      un objectif de réduction renforcé dans ces secteurs ?

  - id: conso_x_znieff
    type: conflit
    a: { indicator: conso_enaf, end: high }
    b: { indicator: znieff1, end: high }
    title: L'artificialisation touche des ZNIEFF de type I
    question: >
      Les inventaires de biodiversité, qui ne sont pas des protections
      réglementaires, suffisent-ils à orienter la consommation d'espaces ?

  - id: conso_x_inondation
    type: conflit
    a: { indicator: conso_enaf, end: high }
    b: { indicator: inondation_eaip, end: high }
    title: On construit en zone inondable
    question: >
      Où la consommation d'espaces récente se fait-elle en zone inondable
      potentielle, et la SNAT doit-elle l'exclure des enveloppes de
      développement ?

  - id: conso_habitat_x_densite_basse
    type: conflit
    a: { indicator: conso_habitat_part, end: high }
    b: { indicator: pop_densite, end: low }
    title: Habitat diffus en secteur peu dense
    question: >
      La consommation pour l'habitat se fait-elle surtout dans des secteurs
      peu denses, loin des services ? Quelle armature territoriale la SNAT
      veut-elle conforter ?

  # ---------- Adaptation au changement climatique ----------
  - id: densite_x_inondation
    type: conflit
    a: { indicator: pop_densite, end: high }
    b: { indicator: inondation_eaip, end: high }
    title: Des quartiers denses en zone inondable
    question: >
      Combien d'habitants vivent dans des secteurs denses exposés au
      débordement de cours d'eau, et quelle part de la stratégie
      d'adaptation leur est consacrée ?

  - id: ages_x_inondation
    type: conflit
    a: { indicator: pop_65plus_part, end: high }
    b: { indicator: inondation_eaip, end: high }
    title: Populations âgées exposées aux crues
    question: >
      Les secteurs où la population est la plus âgée sont-ils aussi exposés ?
      Les plans de gestion de crise en tiennent-ils compte ?

  - id: pauvrete_x_inondation
    type: conflit
    a: { indicator: pauvrete_part, end: high }
    b: { indicator: inondation_eaip, end: high }
    title: Pauvreté et exposition aux crues se cumulent
    question: >
      Les ménages les plus modestes sont-ils surexposés au risque, avec moins
      de moyens pour s'adapter ou se relocaliser ?

  - id: inondation_x_densite_basse
    type: synergie
    a: { indicator: inondation_eaip, end: high }
    b: { indicator: pop_densite, end: low }
    title: Des champs d'expansion des crues encore libres
    question: >
      Ces zones inondables peu habitées peuvent-elles être sanctuarisées comme
      champs d'expansion des crues, au bénéfice des villes en aval ?

  # ---------- Biodiversité ----------
  - id: natura_x_conso_basse
    type: synergie
    a: { indicator: natura2000, end: high }
    b: { indicator: conso_enaf, end: low }
    title: Des sites protégés épargnés par l'artificialisation
    question: >
      Où la protection fonctionne-t-elle, et qu'est-ce qui la distingue des
      sites sous pression ?

  # ---------- Énergies renouvelables ----------
  - id: enr_x_natura
    type: conflit
    a: { indicator: enr_puissance, end: high }
    b: { indicator: natura2000, end: high }
    title: Énergies renouvelables dans des sites Natura 2000
    question: >
      Les zones d'accélération des EnR évitent-elles les sites protégés, ou la
      planification énergétique et la planification écologique se
      contredisent-elles ?

  - id: enr_x_agri
    type: conflit
    a: { indicator: enr_puissance, end: high }
    b: { indicator: agri_part, end: high }
    title: Énergies renouvelables sur des terres agricoles
    question: >
      Le développement du solaire au sol et de l'agrivoltaïsme se fait-il sur
      des terres cultivées ? Quel arbitrage la SNAT propose-t-elle entre
      souveraineté alimentaire et énergétique ?

  - id: enr_x_densite_basse
    type: synergie
    a: { indicator: enr_puissance, end: high }
    b: { indicator: pop_densite, end: low }
    title: Énergies renouvelables loin des habitations
    question: >
      Les territoires peu denses qui accueillent la production d'énergie en
      tirent-ils des retombées, et comment la SNAT organise-t-elle la
      solidarité entre territoires producteurs et consommateurs ?
