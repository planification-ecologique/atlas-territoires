[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Pipeline de l'atlas des territoires : sources ouvertes vers grille H3 et fichiers statiques"
requires-python = ">=3.10"
dependencies = [
  "h3>=4.1",
  "numpy>=1.26",
  "pandas>=2.1",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyogrio>=0.7",
  "pyproj>=3.6",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["atlas_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
