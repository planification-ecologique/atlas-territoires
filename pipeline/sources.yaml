# Sources de données brutes.
#
# Chaque source est téléchargée dans pipeline/cache/raw/<id>/ puis lue par
# geopandas (formats vecteur) ou pandas (CSV). Les URL viennent de data.gouv.fr
# (novembre 2026) ; celles marquées `verify: true` sont à confirmer avant un
# premier vrai passage, car le producteur publie plusieurs millésimes ou ne
# donne qu'une page de téléchargement.
#
# `columns` fait correspondre le nom de colonne attendu par le registre au nom
# de colonne réel du fichier (insensible à la casse).

admin_express:
  label: IGN ADMIN EXPRESS COG (communes, régions)
  licence: Licence Ouverte 2.0
  page: https://geoservices.ign.fr/adminexpress
  url: https://data.geopf.fr/telechargement/download/ADMIN-EXPRESS-COG/ADMIN-EXPRESS-COG_3-2__SHP_WGS84G_FRA_2025-04-02/ADMIN-EXPRESS-COG_3-2__SHP_WGS84G_FRA_2025-04-02.7z
  verify: true
  layers: { communes: COMMUNE, regions: REGION }

filosofi_200m:
  label: Insee, Filosofi 2021, données carroyées à 200 m
  licence: Licence Ouverte 2.0
  page: https://www.insee.fr/fr/statistiques/8735103?sommaire=8735243
  url: null          # zip GeoPackage métropole, à renseigner depuis la page Insee
  verify: true
  columns:
    ind: ind
    ind_65_79: ind_65_79
    ind_80p: ind_80p
    men: men
    men_pauv: men_pauv

cerema_conso_carroyage:
  label: Cerema, consommation d'espaces NAF 2011-2025, carroyage 1 km
  licence: Licence Ouverte 2.0
  page: https://www.data.gouv.fr/datasets/consommation-despaces-naturels-agricoles-et-forestiers-du-1er-janvier-2011-au-1er-janvier-2025
  url: https://static.data.gouv.fr/resources/consommation-despaces-naturels-agricoles-et-forestiers-du-1er-janvier-2011-au-1er-janvier-2025/20260511-111136/conso-carroyage.gpkg
  doc: https://doc-datafoncier.cerema.fr/doc/conso-enaf/
  # Les champs sont en m² dans les millésimes précédents : le pipeline convertit en ha.
  unit_factor: 0.0001
  columns:
    naf11art24: naf11art24
    art11hab24: art11hab24
  verify: true       # noms de colonnes à confirmer dans le dictionnaire Cerema

eaip_cours_eau:
  label: Enveloppe approchée des inondations potentielles (débordement de cours d'eau)
  licence: Licence Ouverte 2.0
  page: https://www.georisques.gouv.fr/donnees/bases-de-donnees/zonages-inondation-rapportage-2020
  url: null          # EAIP par bassin ou par département (ex. Loir-et-Cher sur data.gouv.fr)
  verify: true

natura2000:
  label: INPN, sites Natura 2000 (SIC/ZSC et ZPS)
  licence: Licence Ouverte 2.0
  page: https://www.data.gouv.fr/datasets/inpn-donnees-du-programme-natura-2000
  urls:
    - https://inpn.mnhn.fr/docs/Shape/sic.zip
    - https://inpn.mnhn.fr/docs/Shape/zps.zip

znieff1:
  label: INPN, ZNIEFF de type I
  licence: Licence Ouverte 2.0
  page: https://inpn.mnhn.fr/telechargement/cartes-et-information-geographique/inv/znieff1
  url: https://inpn.mnhn.fr/docs/Shape/znieff1.zip
  verify: true

rpg:
  label: IGN, registre parcellaire graphique (RPG), niveau 1
  licence: Licence Ouverte 2.0
  page: https://geoservices.ign.fr/rpg
  url: null          # archive par région, à renseigner pour le millésime choisi
  verify: true

odre_registre:
  label: ODRÉ, registre national des installations de production et de stockage d'électricité
  licence: Licence Ouverte 2.0
  page: https://www.data.gouv.fr/datasets/registre-national-des-installations-de-production-et-de-stockage-delectricite-au-30-09-2026
  url: https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/registre-national-installation-production-stockage-electricite-agrege/exports/csv?delimiter=%3B
  format: csv
  sep: ";"
  columns:
    codeinseecommune: codeinseecommune
    filiere: filiere
    puismaxinstallee: puismaxinstallee   # en kW dans le registre
  verify: true
